name: Test observations-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          observations-path: tests/fixtures/clean-transcript.jsonl
          strict: 'false'
      - name: Assert action succeeded with observations-path
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
          SCORE: ${{ steps.action.outputs.score }}
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "violations: $VIOLATIONS"
          echo "score: $SCORE"
          if [ -z "$VIOLATIONS" ]; then
            echo "FAIL: violations output is empty"
            exit 1
          fi
          if [ -z "$SCORE" ]; then
            echo "FAIL: score output is empty"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report output is empty"
            exit 1
          fi
          echo "PASS: observations-path input works correctly (violations=$VIOLATIONS, score=$SCORE)"
