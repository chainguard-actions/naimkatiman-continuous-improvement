name: Test observations-path input - alternate input for CI session observations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          observations-path: tests/fixtures/good-transcript.jsonl

      - name: Assert violations output is present and numeric
        env:
          ACTUAL: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected numeric violations output, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: violations=$ACTUAL"

      - name: Assert score output is present and numeric
        env:
          ACTUAL: ${{ steps.action.outputs.score }}
        run: |
          echo "score: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected numeric score output, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: score=$ACTUAL"

      - name: Assert report output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.report }}
        run: |
          echo "report length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty report output"
            exit 1
          fi
          echo "PASS"
