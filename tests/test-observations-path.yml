name: Test observations path input produces valid report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          observations-path: 'tests/fixtures/observations.jsonl'
          strict: 'false'
        continue-on-error: true

      - name: Run linter on observations file
        run: |
          OUTPUT=$(node "$GITHUB_WORKSPACE/tests/fixtures/lint-transcript.mjs" \
            "$GITHUB_WORKSPACE/tests/fixtures/observations.jsonl")
          echo "output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          echo "PASS: linter produced output for observations file"

      - name: Assert report contains discipline header
        run: |
          OUTPUT=$(node "$GITHUB_WORKSPACE/tests/fixtures/lint-transcript.mjs" \
            "$GITHUB_WORKSPACE/tests/fixtures/observations.jsonl")
          echo "output: $OUTPUT"
          if ! echo "$OUTPUT" | grep -q "Agent Discipline Report"; then
            echo "FAIL: report should contain 'Agent Discipline Report' header"
            exit 1
          fi
          echo "PASS: report contains expected header"

      - name: Assert report contains score
        run: |
          OUTPUT=$(node "$GITHUB_WORKSPACE/tests/fixtures/lint-transcript.mjs" \
            "$GITHUB_WORKSPACE/tests/fixtures/observations.jsonl")
          if ! echo "$OUTPUT" | grep -q "Score:"; then
            echo "FAIL: report should contain 'Score:' field"
            exit 1
          fi
          echo "PASS: report contains score field"

      - name: Assert JSON output is valid for observations file
        run: |
          JSON=$(node "$GITHUB_WORKSPACE/tests/fixtures/lint-transcript.mjs" \
            --json "$GITHUB_WORKSPACE/tests/fixtures/observations.jsonl")
          echo "json: $JSON"
          python3 -c "
          import sys, json
          r = json.loads(sys.argv[1])
          assert isinstance(r['score'], (int, float)), 'score must be a number'
          assert isinstance(r['violations'], list), 'violations must be a list'
          assert isinstance(r['stats'], dict), 'stats must be a dict'
          print('PASS: JSON output has expected structure')
          " "$JSON"
