name: Test observations-path input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create observations fixture
        run: |
          cat > /tmp/observations.jsonl <<'EOF'
          {"tool":"Read","tool_input":{"file_path":"src/main.js"},"session_id":"obs1"}
          {"tool":"Grep","tool_input":{"pattern":"function"},"session_id":"obs1"}
          {"tool":"Write","tool_input":{"file_path":"src/main.js"},"session_id":"obs1"}
          {"tool":"Bash","tool_input":{"command":"jest --coverage"},"session_id":"obs1"}
          EOF

      - id: action
        uses: .
        with:
          observations-path: /tmp/observations.jsonl
          strict: 'false'

      - name: Assert violations output is set
        env:
          ACTUAL: ${{ steps.action.outputs.violations }}
        run: |
          echo "actual violations: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected violations output to be set"
            exit 1
          fi
          echo "PASS: violations output is set to '$ACTUAL'"

      - name: Assert score output is set
        env:
          ACTUAL: ${{ steps.action.outputs.score }}
        run: |
          echo "actual score: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected score output to be set"
            exit 1
          fi
          echo "PASS: score output is set to '$ACTUAL'"

      - name: Assert report contains discipline report header
        env:
          ACTUAL: ${{ steps.action.outputs.report }}
        run: |
          echo "actual report: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "Agent Discipline Report"; then
            echo "FAIL: expected report to contain 'Agent Discipline Report'"
            exit 1
          fi
          echo "PASS: report contains expected header"
