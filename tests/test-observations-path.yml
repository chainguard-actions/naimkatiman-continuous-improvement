name: Test observations-path input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create observations fixture
        run: |
          # A clean session: research first, then write, then verify
          cat > /tmp/observations.jsonl <<'EOF'
          {"tool":"Read","tool_input":{"file_path":"src/main.js"},"session_id":"obs-001"}
          {"tool":"Grep","tool_input":{"pattern":"TODO"},"session_id":"obs-001"}
          {"tool":"Write","tool_input":{"file_path":"src/main.js"},"session_id":"obs-001"}
          {"tool":"Bash","tool_input":{"command":"jest --coverage"},"session_id":"obs-001"}
          EOF

      - id: action
        uses: .
        with:
          observations-path: /tmp/observations.jsonl
          strict: 'false'

      - name: Assert violations is zero
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected 0 violations, got $VIOLATIONS"
            exit 1
          fi
          echo "PASS"

      - name: Assert score output is present and numeric
        env:
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "score: $SCORE"
          if ! echo "$SCORE" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected numeric score, got '$SCORE'"
            exit 1
          fi
          echo "PASS: score is $SCORE"

      - name: Assert report contains discipline header
        env:
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "report: $REPORT"
          if ! echo "$REPORT" | grep -q "Agent Discipline Report"; then
            echo "FAIL: expected report to contain 'Agent Discipline Report'"
            exit 1
          fi
          echo "PASS"
