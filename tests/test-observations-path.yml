name: Test observations-path input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create observations fixture
        run: |
          mkdir -p /tmp/fixtures
          # Disciplined agent using observations-path input
          cat > /tmp/fixtures/observations.jsonl <<'EOF'
          {"tool":"Read","tool_input":{"file_path":"src/index.js"},"session_id":"obs1"}
          {"tool":"Grep","tool_input":{"pattern":"TODO"},"session_id":"obs1"}
          {"tool":"Write","tool_input":{"file_path":"src/index.js"},"session_id":"obs1"}
          {"tool":"Bash","tool_input":{"command":"jest --runInBand"},"session_id":"obs1"}
          EOF

      - id: action
        uses: .
        with:
          observations-path: /tmp/fixtures/observations.jsonl
          strict: 'false'

      - name: Assert violations output is set
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ -z "$VIOLATIONS" ]; then
            echo "FAIL: violations output was not set"
            exit 1
          fi
          echo "PASS: violations=$VIOLATIONS"

      - name: Assert score output is set and in range
        env:
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "score: $SCORE"
          if [ -z "$SCORE" ]; then
            echo "FAIL: score output was not set"
            exit 1
          fi
          if [ "$SCORE" -lt 0 ] || [ "$SCORE" -gt 100 ]; then
            echo "FAIL: score $SCORE is out of range 0-100"
            exit 1
          fi
          echo "PASS: score=$SCORE"

      - name: Assert report output is non-empty
        env:
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "report: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report output was empty"
            exit 1
          fi
          echo "PASS"
