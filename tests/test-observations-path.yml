name: Test observations-path input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: lint
        uses: .
        with:
          observations-path: tests/fixtures/good-transcript.jsonl
          strict: 'false'

      - name: Assert violations output is set
        env:
          VIOLATIONS: ${{ steps.lint.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ -z "$VIOLATIONS" ]; then
            echo "FAIL: expected violations output to be set"
            exit 1
          fi
          echo "PASS: violations=$VIOLATIONS"

      - name: Assert score output is set
        env:
          SCORE: ${{ steps.lint.outputs.score }}
        run: |
          echo "score: $SCORE"
          if [ -z "$SCORE" ]; then
            echo "FAIL: expected score output to be set"
            exit 1
          fi
          echo "PASS: score=$SCORE"

      - name: Assert report output is set
        env:
          REPORT: ${{ steps.lint.outputs.report }}
        run: |
          echo "report length: ${#REPORT}"
          if [ -z "$REPORT" ]; then
            echo "FAIL: expected report output to be set"
            exit 1
          fi
          echo "PASS"
