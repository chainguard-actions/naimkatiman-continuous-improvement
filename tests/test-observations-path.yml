name: Test observations-path input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: lint
        uses: .
        with:
          observations-path: tests/fixtures/clean-transcript.jsonl

      - name: Assert zero violations via observations-path
        env:
          VIOLATIONS: ${{ steps.lint.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected 0 violations, got '$VIOLATIONS'"
            exit 1
          fi
          echo "PASS"

      - name: Assert score is 100 via observations-path
        env:
          SCORE: ${{ steps.lint.outputs.score }}
        run: |
          echo "score: $SCORE"
          if [ "$SCORE" != "100" ]; then
            echo "FAIL: expected score 100, got '$SCORE'"
            exit 1
          fi
          echo "PASS"
