name: Test observations-path input - alternative to transcript-path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create observations fixture
        run: |
          mkdir -p /tmp/observations
          # A well-behaved agent using observations format
          cat > /tmp/observations/observations.jsonl <<'EOF'
          {"tool_name":"Grep","tool_input":{"pattern":"test","path":"."},"session_id":"obs1"}
          {"tool_name":"Read","tool_input":{"file_path":"src/main.js"},"session_id":"obs1"}
          {"tool_name":"Write","tool_input":{"file_path":"src/main.js"},"session_id":"obs1"}
          {"tool_name":"Bash","tool_input":{"command":"jest --coverage"},"session_id":"obs1"}
          EOF

      - id: action
        uses: .
        with:
          observations-path: /tmp/observations/observations.jsonl
          strict: 'false'

      - name: Assert violations output is 0
        env:
          ACTUAL: ${{ steps.action.outputs.violations }}
        run: |
          echo "actual violations: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected 0 violations, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert score output is 100
        env:
          ACTUAL: ${{ steps.action.outputs.score }}
        run: |
          echo "actual score: $ACTUAL"
          if [ "$ACTUAL" != "100" ]; then
            echo "FAIL: expected score 100, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
