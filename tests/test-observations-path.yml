name: Test observations-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          observations-path: tests/fixtures/good-transcript.jsonl

      - name: Assert violations output is set
        env:
          ACTUAL: ${{ steps.action.outputs.violations }}
        run: |
          echo "actual violations: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected violations output to be set"
            exit 1
          fi
          echo "PASS: violations output is set to '$ACTUAL'"

      - name: Assert score output is set
        env:
          ACTUAL: ${{ steps.action.outputs.score }}
        run: |
          echo "actual score: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected score output to be set"
            exit 1
          fi
          echo "PASS: score output is set to '$ACTUAL'"

      - name: Assert report output is set
        env:
          ACTUAL: ${{ steps.action.outputs.report }}
        run: |
          echo "actual report length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected report output to be set"
            exit 1
          fi
          echo "PASS: report output is set"

      - name: Assert score is 100 for clean transcript via observations-path
        env:
          ACTUAL: ${{ steps.action.outputs.score }}
        run: |
          echo "actual score: $ACTUAL"
          if [ "$ACTUAL" != "100" ]; then
            echo "FAIL: expected score=100 for clean transcript, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: score=100"
