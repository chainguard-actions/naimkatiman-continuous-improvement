name: Test observations-path input with clean transcript
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean observations fixture
        run: |
          # A well-disciplined session: research first, then write, then verify
          cat > /tmp/observations.jsonl << 'EOF'
          {"tool":"Grep","tool_input":{"pattern":"TODO","path":"."},"session_id":"obs1"}
          {"tool":"Read","tool_input":{"file_path":"src/main.js"},"session_id":"obs1"}
          {"tool":"Write","tool_input":{"file_path":"src/main.js"},"session_id":"obs1"}
          {"tool":"Bash","tool_input":{"command":"jest --coverage"},"session_id":"obs1"}
          EOF

      - id: action
        uses: .
        with:
          observations-path: /tmp/observations.jsonl
          strict: 'true'

      - name: Assert action succeeded with clean observations
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "outcome: $OUTCOME"
          echo "violations: $VIOLATIONS"
          echo "score: $SCORE"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with clean observations, got '$OUTCOME'"
            exit 1
          fi
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected 0 violations, got '$VIOLATIONS'"
            exit 1
          fi
          echo "PASS: clean observations passed strict mode with score $SCORE"
