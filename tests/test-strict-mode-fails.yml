name: Test strict mode fails on violations
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a transcript with violations (writes without research, no verification)
        run: |
          cat > /tmp/strict-bad-transcript.jsonl <<'EOF'
          {"tool":"Write","tool_input":{"file_path":"src/a.js"},"session_id":"sess-1"}
          {"tool":"Edit","tool_input":{"file_path":"src/b.js"},"session_id":"sess-1"}
          EOF

      - id: action
        uses: .
        with:
          transcript-path: /tmp/strict-bad-transcript.jsonl
          strict: 'true'
        continue-on-error: true

      - name: Assert action failed due to strict mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail in strict mode with violations, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed in strict mode"
