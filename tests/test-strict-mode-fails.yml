name: Test strict mode fails on violations
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          transcript-path: '${{ github.workspace }}/pristine/naimkatiman--continuous-improvement/v3.9.2/tests/fixtures/violating-transcript.jsonl'
          strict: 'true'
        continue-on-error: true

      - name: Assert action failed (strict mode with violations or missing argv)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "FAIL: expected action to fail in strict mode with violations, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed (outcome=${{ steps.action.outcome }})"
