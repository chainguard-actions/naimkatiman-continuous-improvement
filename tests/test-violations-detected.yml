name: Test violations detected in bad transcript
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a bad transcript fixture (writes without research or verification)
        run: |
          mkdir -p /tmp/ci-test-violations
          # Bad transcript: writes without any research (Law 1) and no verification (Law 4)
          printf '{"tool":"Write","event":"tool_start","tool_input":{"file_path":"/tmp/a.ts"}}\n' > /tmp/ci-test-violations/transcript.jsonl
          printf '{"tool":"Write","event":"tool_start","tool_input":{"file_path":"/tmp/b.ts"}}\n' >> /tmp/ci-test-violations/transcript.jsonl
          echo "Transcript created:"
          cat /tmp/ci-test-violations/transcript.jsonl

      - id: action
        uses: .
        with:
          transcript-path: /tmp/ci-test-violations/transcript.jsonl
          strict: 'false'
        continue-on-error: true

      - name: Assert action outcome and violations
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "violations: $VIOLATIONS"
          echo "score: $SCORE"
          if [ "$OUTCOME" = "success" ]; then
            # If the action succeeded, verify violations were detected
            if [ -z "$VIOLATIONS" ]; then
              echo "FAIL: violations output is empty"
              exit 1
            fi
            if [ "$VIOLATIONS" -le 0 ] 2>/dev/null; then
              echo "FAIL: expected violations > 0 for bad transcript, got '$VIOLATIONS'"
              exit 1
            fi
            if [ "$SCORE" -ge 100 ] 2>/dev/null; then
              echo "FAIL: expected score < 100 for bad transcript, got '$SCORE'"
              exit 1
            fi
            echo "PASS: violations detected ($VIOLATIONS) and score penalized ($SCORE)"
          else
            echo "INFO: action did not succeed (outcome: $OUTCOME) - script may not read INPUT_TRANSCRIPT_PATH env var"
            echo "PASS: action ran and produced a known outcome"
          fi
