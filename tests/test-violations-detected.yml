name: Test violations detected in transcript
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create transcript with violations
        run: |
          # This transcript has Write before any Read/Grep/Glob (Law 1 violation)
          # and no verification commands (Law 4 violation)
          cat > /tmp/violations-transcript.jsonl <<'EOF'
          {"tool":"Write","tool_input":{"file_path":"file1.js"},"session_id":"sess-bad"}
          {"tool":"Edit","tool_input":{"file_path":"file2.js"},"session_id":"sess-bad"}
          {"tool":"Write","tool_input":{"file_path":"file3.js"},"session_id":"sess-bad"}
          EOF

      - id: action
        uses: .
        with:
          transcript-path: /tmp/violations-transcript.jsonl
          strict: 'false'

      - name: Assert violations output is greater than zero
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ -z "$VIOLATIONS" ] || [ "$VIOLATIONS" -le 0 ]; then
            echo "FAIL: expected violations > 0, got $VIOLATIONS"
            exit 1
          fi
          echo "PASS: $VIOLATIONS violation(s) detected"

      - name: Assert score is less than 100
        env:
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "score: $SCORE"
          if [ -z "$SCORE" ] || [ "$SCORE" -ge 100 ]; then
            echo "FAIL: expected score < 100, got $SCORE"
            exit 1
          fi
          echo "PASS: score is $SCORE"

      - name: Assert report mentions violations
        env:
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "report: $REPORT"
          if ! echo "$REPORT" | grep -qi "violation"; then
            echo "FAIL: expected report to mention violations"
            exit 1
          fi
          echo "PASS"
