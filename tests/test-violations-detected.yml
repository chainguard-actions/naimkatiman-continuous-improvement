name: Test violations detected - bad discipline transcript
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a poorly-disciplined transcript (writes before research, no verification)
        run: |
          mkdir -p /tmp/transcripts
          cat > /tmp/transcripts/bad-agent.jsonl <<'EOF'
          {"tool":"Write","tool_input":{"file_path":"src/main.js","content":"// changed"},"session_id":"sess-bad"}
          {"tool":"Edit","tool_input":{"file_path":"src/utils.js","content":"// edited"},"session_id":"sess-bad"}
          {"tool":"Write","tool_input":{"file_path":"src/helper.js","content":"// helper"},"session_id":"sess-bad"}
          EOF

      - id: action
        uses: .
        with:
          transcript-path: /tmp/transcripts/bad-agent.jsonl
          strict: 'false'

      - name: Assert violations output is greater than zero
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ -z "$VIOLATIONS" ] || [ "$VIOLATIONS" -le 0 ] 2>/dev/null; then
            echo "FAIL: expected violations > 0, got '$VIOLATIONS'"
            exit 1
          fi
          echo "PASS: violations=$VIOLATIONS (> 0)"

      - name: Assert score is less than 100
        env:
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "score: $SCORE"
          if [ -z "$SCORE" ]; then
            echo "FAIL: score output is empty"
            exit 1
          fi
          if [ "$SCORE" -ge 100 ] 2>/dev/null; then
            echo "FAIL: expected score < 100 for bad transcript, got '$SCORE'"
            exit 1
          fi
          echo "PASS: score=$SCORE (< 100)"

      - name: Assert report mentions violations
        env:
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "report: $REPORT"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report output is empty"
            exit 1
          fi
          if ! echo "$REPORT" | grep -qi "violation"; then
            echo "FAIL: report does not mention violations"
            exit 1
          fi
          echo "PASS: report mentions violations"
