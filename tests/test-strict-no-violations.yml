name: Test strict mode passes when no violations
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: lint
        uses: .
        with:
          transcript-path: tests/fixtures/good-transcript.jsonl
          strict: 'true'

      - name: Assert action succeeded with strict mode and no violations
        env:
          VIOLATIONS: ${{ steps.lint.outputs.violations }}
          SCORE: ${{ steps.lint.outputs.score }}
        run: |
          echo "violations: $VIOLATIONS"
          echo "score: $SCORE"
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected 0 violations in strict mode with clean transcript, got '$VIOLATIONS'"
            exit 1
          fi
          echo "PASS: strict mode passed with 0 violations and score=$SCORE"
