name: Test no inputs (no transcript path)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no inputs
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action exits gracefully with no inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without a transcript path, the action should fail (no file to analyze)
          # This is expected behavior — no path provided means error
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no transcript path was provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (may have handled missing path gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
