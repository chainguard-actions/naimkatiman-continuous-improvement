name: Test stdin mode for transcript linting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          transcript-path: 'tests/fixtures/clean-transcript.jsonl'
          strict: 'false'
        continue-on-error: true

      - name: Assert stdin mode works with clean transcript
        run: |
          OUTPUT=$(cat "$GITHUB_WORKSPACE/tests/fixtures/clean-transcript.jsonl" | \
            node "$GITHUB_WORKSPACE/tests/fixtures/lint-transcript.mjs" --stdin)
          echo "output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "Agent Discipline Report"; then
            echo "FAIL: report should contain 'Agent Discipline Report' header"
            exit 1
          fi
          echo "PASS: stdin mode works correctly"

      - name: Assert stdin mode detects violations in bad transcript
        run: |
          JSON=$(cat "$GITHUB_WORKSPACE/tests/fixtures/violations-transcript.jsonl" | \
            node "$GITHUB_WORKSPACE/tests/fixtures/lint-transcript.mjs" --stdin --json)
          echo "json: $JSON"
          VIOLATIONS=$(echo "$JSON" | python3 -c "import sys,json; print(len(json.load(sys.stdin)['violations']))")
          echo "violations: $VIOLATIONS"
          if [ -z "$VIOLATIONS" ] || [ "$VIOLATIONS" = "0" ]; then
            echo "FAIL: expected violations > 0 via stdin but got '$VIOLATIONS'"
            exit 1
          fi
          echo "PASS: stdin mode correctly detected $VIOLATIONS violations"

      - name: Assert strict mode via stdin exits 1 with violations
        run: |
          set +e
          cat "$GITHUB_WORKSPACE/tests/fixtures/violations-transcript.jsonl" | \
            node "$GITHUB_WORKSPACE/tests/fixtures/lint-transcript.mjs" --stdin --strict
          EXIT_CODE=$?
          set -e
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" = "0" ]; then
            echo "FAIL: expected exit code 1 in strict+stdin mode with violations"
            exit 1
          fi
          echo "PASS: strict+stdin mode correctly exited with code $EXIT_CODE"
