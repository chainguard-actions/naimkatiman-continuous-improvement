name: Test basic clean transcript (no violations)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean transcript fixture
        run: |
          mkdir -p /tmp/fixtures
          # A well-disciplined agent: research first, then write, then verify
          cat > /tmp/fixtures/clean.jsonl <<'EOF'
          {"tool":"Read","tool_input":{"file_path":"README.md"},"session_id":"s1"}
          {"tool":"Grep","tool_input":{"pattern":"foo"},"session_id":"s1"}
          {"tool":"Glob","tool_input":{"pattern":"**/*.js"},"session_id":"s1"}
          {"tool":"Write","tool_input":{"file_path":"out.js"},"session_id":"s1"}
          {"tool":"Bash","tool_input":{"command":"npm run test"},"session_id":"s1"}
          EOF

      - id: action
        uses: .
        with:
          transcript-path: /tmp/fixtures/clean.jsonl
          strict: 'false'

      - name: Assert violations is 0
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected 0 violations, got $VIOLATIONS"
            exit 1
          fi
          echo "PASS"

      - name: Assert score is 100
        env:
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "score: $SCORE"
          if [ "$SCORE" != "100" ]; then
            echo "FAIL: expected score 100, got $SCORE"
            exit 1
          fi
          echo "PASS"

      - name: Assert report contains discipline header
        env:
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "report: $REPORT"
          if ! echo "$REPORT" | grep -q "Agent Discipline Report"; then
            echo "FAIL: report does not contain 'Agent Discipline Report'"
            exit 1
          fi
          echo "PASS"
