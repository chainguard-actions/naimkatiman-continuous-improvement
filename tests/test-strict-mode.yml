name: Test strict mode - violations cause failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a poorly-disciplined transcript (writes before research, no verification)
        run: |
          mkdir -p /tmp/transcripts
          cat > /tmp/transcripts/strict-bad-agent.jsonl <<'EOF'
          {"tool":"Write","tool_input":{"file_path":"src/main.js","content":"// changed without research"},"session_id":"sess-strict"}
          {"tool":"Edit","tool_input":{"file_path":"src/utils.js","content":"// edited without research"},"session_id":"sess-strict"}
          EOF

      - id: action
        uses: .
        with:
          transcript-path: /tmp/transcripts/strict-bad-agent.jsonl
          strict: 'true'
        continue-on-error: true

      - name: Assert action failed due to strict mode violations
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "outcome: $OUTCOME"
          echo "violations: $VIOLATIONS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail in strict mode with violations, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed in strict mode with violations"
