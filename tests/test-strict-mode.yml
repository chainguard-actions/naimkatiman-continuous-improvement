name: Test strict mode fails on violations
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a bad transcript (writes without research, no verification)
        run: |
          cat > /tmp/strict-bad-transcript.jsonl <<'EOF'
          {"tool":"Write","tool_input":{"file_path":"src/foo.js","content":"// changed"},"session_id":"sess-1"}
          {"tool":"Write","tool_input":{"file_path":"src/bar.js","content":"// changed"},"session_id":"sess-1"}
          {"tool":"Edit","tool_input":{"file_path":"src/baz.js","content":"// changed"},"session_id":"sess-1"}
          EOF

      - name: Run action with strict mode enabled (should fail due to violations)
        id: action
        uses: .
        with:
          transcript-path: /tmp/strict-bad-transcript.jsonl
          strict: 'true'
        continue-on-error: true

      - name: Assert action failed in strict mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "outcome: $OUTCOME"
          echo "violations: $VIOLATIONS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail in strict mode with violations, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed in strict mode when violations were detected"
