name: Test strict mode fails on violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create violating transcript fixture
        run: |
          # Writes with no research and no verification — guaranteed violations
          cat > /tmp/strict-violating.jsonl << 'EOF'
          {"tool":"Write","tool_input":{"file_path":"a.js"},"session_id":"s1"}
          {"tool":"Edit","tool_input":{"file_path":"b.js"},"session_id":"s1"}
          {"tool":"Write","tool_input":{"file_path":"c.js"},"session_id":"s1"}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          transcript-path: /tmp/strict-violating.jsonl
          strict: 'true'

      - name: Assert action failed due to strict mode violations
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail in strict mode with violations, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed in strict mode"
