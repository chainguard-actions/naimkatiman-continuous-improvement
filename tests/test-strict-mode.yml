name: Test strict mode fails on violations
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create transcript with violations
        run: |
          # Write before any research = Law 1 violation; no verify = Law 4 violation
          cat > /tmp/strict-violations.jsonl <<'EOF'
          {"tool":"Write","tool_input":{"file_path":"bad.js"},"session_id":"sess-strict"}
          {"tool":"Edit","tool_input":{"file_path":"bad2.js"},"session_id":"sess-strict"}
          EOF

      - id: action
        uses: .
        with:
          transcript-path: /tmp/strict-violations.jsonl
          strict: 'true'
        continue-on-error: true

      - name: Assert action failed due to strict mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "outcome: $OUTCOME"
          echo "violations: $VIOLATIONS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail in strict mode with violations, but outcome was $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed in strict mode"
