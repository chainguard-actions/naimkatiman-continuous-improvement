name: Test strict mode - action fails on violations or missing path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          transcript-path: tests/fixtures/violating-transcript.jsonl
          strict: 'true'
        continue-on-error: true

      - name: Assert action failed (strict mode with violations, or missing argv path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (strict mode with violations or missing argv path), got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed in strict mode"
