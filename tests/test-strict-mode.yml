name: Test strict mode - fails on violations
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          transcript-path: tests/fixtures/transcripts/bad.jsonl
          strict: 'true'
        continue-on-error: true

      - name: Assert action failed
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (strict mode with violations, or script exits with no argv), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed"
