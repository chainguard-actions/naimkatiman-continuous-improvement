name: Test strict mode - action fails on violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          transcript-path: tests/fixtures/bad-transcript.jsonl
          strict: 'true'
        continue-on-error: true

      - name: Assert action failed due to violations in strict mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "outcome: $OUTCOME"
          echo "violations: $VIOLATIONS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail in strict mode with violations, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed in strict mode with violations"
