name: Test strict mode passes on clean transcript
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          transcript-path: '${{ github.workspace }}/pristine/naimkatiman--continuous-improvement/v3.9.2/tests/fixtures/clean-transcript.jsonl'
          strict: 'true'
        continue-on-error: true

      - name: Assert action completed (not cancelled)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=${{ steps.action.outcome }}"

      - name: Assert outputs if action succeeded
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
          SCORE: ${{ steps.action.outputs.score }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "violations: $VIOLATIONS"
          echo "score: $SCORE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$VIOLATIONS" ] && [ "$VIOLATIONS" != "0" ]; then
              echo "FAIL: expected 0 violations in strict mode with clean transcript, got '$VIOLATIONS'"
              exit 1
            fi
            echo "PASS: strict mode passed with clean transcript (violations=$VIOLATIONS, score=$SCORE)"
          else
            echo "INFO: action did not succeed (outcome=$OUTCOME), skipping output assertions"
            echo "PASS: action completed without being cancelled"
          fi
