name: Test transcript with violations
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create violations transcript fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/violations-transcript.jsonl" <<'EOF'
          {"tool":"Write","tool_input":{"file_path":"a.js"},"session_id":"s1"}
          {"tool":"Write","tool_input":{"file_path":"b.js"},"session_id":"s1"}
          {"tool":"Write","tool_input":{"file_path":"c.js"},"session_id":"s1"}
          EOF

      - id: action
        uses: .
        with:
          transcript-path: tests/fixtures/violations-transcript.jsonl
          strict: 'false'

      - name: Assert violations is greater than 0
        env:
          ACTUAL: ${{ steps.action.outputs.violations }}
        run: |
          echo "actual violations: $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" -le 0 ] 2>/dev/null; then
            echo "FAIL: expected violations > 0 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: violations=$ACTUAL"

      - name: Assert score is less than 100
        env:
          ACTUAL: ${{ steps.action.outputs.score }}
        run: |
          echo "actual score: $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" -ge 100 ] 2>/dev/null; then
            echo "FAIL: expected score < 100 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: score=$ACTUAL"

      - name: Assert report mentions violations
        env:
          ACTUAL: ${{ steps.action.outputs.report }}
        run: |
          echo "actual report: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qi "violation"; then
            echo "FAIL: expected report to mention violations"
            exit 1
          fi
          echo "PASS"
