name: Test violations transcript with strict mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          transcript-path: pristine/naimkatiman--continuous-improvement/v3.15.0/tests/fixtures/violations-transcript.jsonl
          strict: 'true'

      - name: Assert action failed (strict mode with violations or missing file path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail in strict mode with violations, got 'success'"
            exit 1
          fi
          echo "PASS: action did not succeed (outcome=$OUTCOME) — expected in strict mode with violations"
