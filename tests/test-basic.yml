name: Test basic usage - clean transcript no violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          transcript-path: tests/fixtures/good-transcript.jsonl

      - name: Assert violations is 0
        env:
          ACTUAL: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected 0 violations, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert score is 100
        env:
          ACTUAL: ${{ steps.action.outputs.score }}
        run: |
          echo "score: $ACTUAL"
          if [ "$ACTUAL" != "100" ]; then
            echo "FAIL: expected score 100, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert report contains no violations message
        env:
          ACTUAL: ${{ steps.action.outputs.report }}
        run: |
          echo "report: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "No law violations detected"; then
            echo "FAIL: expected 'No law violations detected' in report"
            exit 1
          fi
          echo "PASS"
