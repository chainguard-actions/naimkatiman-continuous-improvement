name: Test basic usage - no inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use the committed fixture copy of the script (not the symlinked action/bin path)
      - name: Verify fixture script exists
        run: |
          SCRIPT="$GITHUB_WORKSPACE/tests/fixtures/lint-transcript.mjs"
          if [ ! -f "$SCRIPT" ]; then
            echo "FAIL: lint-transcript.mjs fixture not found at $SCRIPT"
            exit 1
          fi
          echo "PASS: script found at $SCRIPT"

      # When called with no file path, the script should exit 1 with an error message
      - name: Verify script exits 1 with no file path
        run: |
          SCRIPT="$GITHUB_WORKSPACE/tests/fixtures/lint-transcript.mjs"
          set +e
          OUTPUT=$(node "$SCRIPT" 2>&1)
          EXIT_CODE=$?
          set -e
          echo "exit code: $EXIT_CODE"
          echo "output: $OUTPUT"
          if [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: expected exit code 1 when no file path given, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: script exits 1 with no file path"

      # Verify --help works
      - name: Verify --help flag works
        run: |
          SCRIPT="$GITHUB_WORKSPACE/tests/fixtures/lint-transcript.mjs"
          OUTPUT=$(node "$SCRIPT" --help)
          echo "help output: $OUTPUT"
          if ! echo "$OUTPUT" | grep -q "lint-transcript"; then
            echo "FAIL: expected help text to mention lint-transcript"
            exit 1
          fi
          echo "PASS: --help works"

      # When called via uses: . with no inputs, the action should fail gracefully
      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran (outcome is failure, not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "INFO: action outcome was '$OUTCOME' (expected 'failure' since no file path)"
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
