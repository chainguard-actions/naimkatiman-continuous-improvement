name: Test clean transcript (no violations)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          transcript-path: tests/fixtures/clean-transcript.jsonl
          strict: 'false'
      - name: Assert violations output is zero
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
          SCORE: ${{ steps.action.outputs.score }}
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "violations: $VIOLATIONS"
          echo "score: $SCORE"
          echo "report: $REPORT"
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected 0 violations, got '$VIOLATIONS'"
            exit 1
          fi
          echo "PASS: violations=0"
      - name: Assert score is 100
        env:
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "score: $SCORE"
          if [ "$SCORE" != "100" ]; then
            echo "FAIL: expected score=100, got '$SCORE'"
            exit 1
          fi
          echo "PASS: score=100"
      - name: Assert report is non-empty
        env:
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "report length: ${#REPORT}"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report output is empty"
            exit 1
          fi
          echo "PASS: report is non-empty"
