name: Test clean transcript (no violations)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean transcript fixture
        run: |
          cat > /tmp/clean-transcript.jsonl <<'EOF'
          {"tool":"Grep","tool_input":{"pattern":"foo","path":"src/"},"session_id":"s1"}
          {"tool":"Read","tool_input":{"file_path":"src/main.js"},"session_id":"s1"}
          {"tool":"Glob","tool_input":{"pattern":"**/*.js"},"session_id":"s1"}
          {"tool":"Write","tool_input":{"file_path":"src/main.js","content":"// updated"},"session_id":"s1"}
          {"tool":"Bash","tool_input":{"command":"npm run test"},"session_id":"s1"}
          EOF

      - id: action
        uses: .
        with:
          transcript-path: /tmp/clean-transcript.jsonl
          strict: 'false'

      - name: Assert violations is 0
        env:
          VIOLATIONS: ${{ steps.action.outputs.violations }}
        run: |
          echo "violations: $VIOLATIONS"
          if [ "$VIOLATIONS" != "0" ]; then
            echo "FAIL: expected 0 violations, got '$VIOLATIONS'"
            exit 1
          fi
          echo "PASS"

      - name: Assert score is 100
        env:
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "score: $SCORE"
          if [ "$SCORE" != "100" ]; then
            echo "FAIL: expected score 100, got '$SCORE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert report is non-empty
        env:
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "report length: ${#REPORT}"
          if [ -z "$REPORT" ]; then
            echo "FAIL: report output is empty"
            exit 1
          fi
          echo "PASS"
